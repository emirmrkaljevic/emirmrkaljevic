<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" width="480" height="170" role="img" aria-label="Skin to Scan: AI skin-lesion screening">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.a1{animation:a1 3s ease-in-out infinite alternate} @keyframes a1{0%{transform:translateY(0)}100%{transform:translateY(74px)}}
.up{animation:up 6s linear infinite} @keyframes up{0%{transform:translateY(0)}100%{transform:translateY(-96px)}}
.eq rect{transform-box:fill-box;transform-origin:bottom;animation:eq .8s ease-in-out infinite alternate} @keyframes eq{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
.cell{animation:cell 4.8s ease-in-out infinite;opacity:.15} @keyframes cell{0%,100%{opacity:.15}20%,45%{opacity:1}}
</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#070b14"/></linearGradient>
  <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#34d399" stop-opacity=".22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="480" height="170" rx="18"/></clipPath>
</defs>
<g clip-path="url(#cl)">
  <rect width="480" height="170" fill="url(#g)"/><rect width="480" height="170" fill="url(#gl)"/>
  <rect width="480" height="4" fill="#34d399"/>
</g>
<rect x="1" y="1" width="478" height="168" rx="17" fill="none" stroke="#1c2638" stroke-width="2"/>
<text class="sans" x="28" y="78" font-size="34" font-weight="800" fill="#e6edf7" letter-spacing="-.5">Skin to Scan</text>
<text class="mono" x="30" y="114" font-size="16" fill="#34d399">AI skin-lesion screening</text>

<g transform="translate(330 30)">
  <rect width="120" height="110" rx="12" fill="#0b1220" stroke="#1c2638"/>
  <path d="M60 30c16-2 30 10 28 26s-12 28-30 26-28-12-26-28 12-22 28-24z" fill="#7a4b3a"/>
  <path d="M58 40c9 0 18 8 16 17s-8 15-18 14-15-8-13-17 7-14 15-14z" fill="#4a2a22"/>
  <g stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M22 26v-10h12M98 26v-10h-12M22 84v10h12M98 84v10h-12"/></g>
  <g class="a1"><rect x="10" y="16" width="100" height="2" fill="#34d399"/><rect x="10" y="4" width="100" height="14" fill="#34d399" opacity=".12"/></g>
</g>
</svg>
