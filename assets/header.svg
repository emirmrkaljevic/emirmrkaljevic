<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Hi, I'm Emir. Software developer, founder of Skin to Scan, builder of TinyRex and PanelOS.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#070b14"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/>
    <animate attributeName="x1" values="0;640;0" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="640;1280;640" dur="10s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="eqg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fb7185"><animate attributeName="stop-color" values="#fb7185;#a78bfa;#22d3ee;#fb7185" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#fbbf24"><animate attributeName="stop-color" values="#fbbf24;#fb7185;#a78bfa;#fbbf24" dur="9s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <clipPath id="card"><rect width="1200" height="420" rx="26"/></clipPath>
  <clipPath id="screen"><rect x="778" y="92" width="344" height="196" rx="10"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.role{opacity:0;animation:role 12s infinite}
@keyframes role{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-10px)}}
.cur{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.eq rect{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.18)}100%{transform:scaleY(1)}}
.scan{animation:scan 5s linear infinite} @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(200px)}}
.float{animation:float 6s ease-in-out infinite} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (max-width:640px){.device,.chips{display:none} .left{transform:translate(-27px,-60px) scale(1.4)}}
.prog{animation:prog 14s linear infinite;transform-box:fill-box;transform-origin:left} @keyframes prog{0%{transform:scaleX(.02)}100%{transform:scaleX(1)}}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cy="200" r="300" fill="url(#glow)"><animate attributeName="cx" values="260;420;260" dur="16s" repeatCount="indefinite"/></circle>
  <circle cx="960" cy="190" r="260" fill="url(#glow2)"><animate attributeName="r" values="240;290;240" dur="7s" repeatCount="indefinite"/></circle>
</g>
<rect x=".5" y=".5" width="1199" height="419" rx="26" fill="none" stroke="#1c2638"/>

<g class="left">
<circle class="pulse" cx="80" cy="88" r="6" fill="#34d399"/>
<text class="mono" x="96" y="94" font-size="17" fill="#8b98ad">online <tspan fill="#1c2638">│</tspan> github.com/<tspan fill="#e6edf7">emirmrkaljevic</tspan></text>

<text class="sans" x="68" y="196" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#name)">Hi, I'm Emir<tspan fill="#e6edf7">.</tspan></text>
<text class="mono role" style="animation-delay:0s" x="72" y="262" font-size="28"><tspan fill="#8b98ad">&gt; </tspan><tspan fill="#e6edf7" font-weight="600">Software Developer</tspan><tspan fill="#22d3ee"> @ UniCredit</tspan></text><text class="mono role" style="animation-delay:3s" x="72" y="262" font-size="28"><tspan fill="#8b98ad">&gt; </tspan><tspan fill="#e6edf7" font-weight="600">Founder</tspan><tspan fill="#34d399"> @ Skin to Scan</tspan></text><text class="mono role" style="animation-delay:6s" x="72" y="262" font-size="28"><tspan fill="#8b98ad">&gt; </tspan><tspan fill="#e6edf7" font-weight="600">Builder</tspan><tspan fill="#a78bfa"> @ TinyRex data tools</tspan></text><text class="mono role" style="animation-delay:9s" x="72" y="262" font-size="28"><tspan fill="#8b98ad">&gt; </tspan><tspan fill="#e6edf7" font-weight="600">Maker</tspan><tspan fill="#fbbf24"> @ PanelOS</tspan></text>
<text class="sans" x="72" y="310" font-size="21" fill="#8b98ad">Banking software by day. AI &amp; data products by night.</text>
<g class="chips"><g><rect x="72" y="336" width="79" height="34" rx="17" fill="#ffffff08" stroke="#1c2638"/><text class="mono" x="112" y="358" font-size="15" fill="#8b98ad" text-anchor="middle">PL/SQL</text></g><g><rect x="161.2" y="336" width="130" height="34" rx="17" fill="#ffffff08" stroke="#1c2638"/><text class="mono" x="226" y="358" font-size="15" fill="#8b98ad" text-anchor="middle">Oracle APEX</text></g><g><rect x="301.4" y="336" width="79" height="34" rx="17" fill="#ffffff08" stroke="#1c2638"/><text class="mono" x="341" y="358" font-size="15" fill="#8b98ad" text-anchor="middle">Python</text></g><g><rect x="390.59999999999997" y="336" width="89" height="34" rx="17" fill="#ffffff08" stroke="#1c2638"/><text class="mono" x="435" y="358" font-size="15" fill="#8b98ad" text-anchor="middle">AI / ML</text></g><g><rect x="489.99999999999994" y="336" width="120" height="34" rx="17" fill="#ffffff08" stroke="#1c2638"/><text class="mono" x="550" y="358" font-size="15" fill="#8b98ad" text-anchor="middle">Automation</text></g></g>
</g>

<!-- PanelOS-style mini screen -->
<g class="device"><g class="float">
  <text class="mono" x="780" y="64" font-size="13" fill="#8b98ad" letter-spacing="1">PANELOS · LIVE</text>
  <rect x="764" y="76" width="372" height="226" rx="18" fill="#0a0f1a" stroke="#2a3650" stroke-width="2"/>
  <rect x="778" y="92" width="344" height="196" rx="10" fill="#04060b"/>
  <g clip-path="url(#screen)">
    <!-- gauges -->
    <g transform="translate(832 150)">
      <circle r="34" fill="none" stroke="#1c2638" stroke-width="8"/>
      <circle r="34" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" values="120;95;130;105;120" dur="6s" repeatCount="indefinite"/></circle>
      <text class="mono" y="4" font-size="17" font-weight="700" fill="#e6edf7" text-anchor="middle">47°</text>
      <text class="mono" y="58" font-size="11" fill="#8b98ad" text-anchor="middle" letter-spacing="2">CPU</text>
    </g>
    <g transform="translate(924 150)">
      <circle r="34" fill="none" stroke="#1c2638" stroke-width="8"/>
      <circle r="34" fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" values="90;125;80;110;90" dur="7s" repeatCount="indefinite"/></circle>
      <text class="mono" y="4" font-size="17" font-weight="700" fill="#e6edf7" text-anchor="middle">52°</text>
      <text class="mono" y="58" font-size="11" fill="#8b98ad" text-anchor="middle" letter-spacing="2">GPU</text>
    </g>
    <!-- album art + eq -->
    <rect x="976" y="112" width="66" height="66" rx="8" fill="url(#art)"/>
    <circle cx="1009" cy="145" r="15" fill="#04060b" opacity=".55"/><circle cx="1009" cy="145" r="4" fill="#ffffff" opacity=".7"/>
    <g class="eq"><rect x="1046" y="116" width="7" height="64" rx="2" fill="url(#eqg)" style="animation-duration:0.70s;animation-delay:-0.00s"/><rect x="1057" y="116" width="7" height="64" rx="2" fill="url(#eqg)" style="animation-duration:1.07s;animation-delay:-0.23s"/><rect x="1068" y="116" width="7" height="64" rx="2" fill="url(#eqg)" style="animation-duration:0.84s;animation-delay:-0.46s"/><rect x="1079" y="116" width="7" height="64" rx="2" fill="url(#eqg)" style="animation-duration:1.21s;animation-delay:-0.69s"/><rect x="1090" y="116" width="7" height="64" rx="2" fill="url(#eqg)" style="animation-duration:0.98s;animation-delay:-0.92s"/><rect x="1101" y="116" width="7" height="64" rx="2" fill="url(#eqg)" style="animation-duration:0.75s;animation-delay:-1.15s"/><rect x="1112" y="116" width="7" height="64" rx="2" fill="url(#eqg)" style="animation-duration:1.12s;animation-delay:-1.38s"/></g>
    <!-- now playing -->
    <text class="mono" x="796" y="236" font-size="12" fill="#8b98ad">♪ now playing</text>
    <text class="mono" x="1104" y="236" font-size="12" fill="#8b98ad" text-anchor="end">RAM 62%</text>
    <rect x="796" y="250" width="308" height="5" rx="2.5" fill="#1c2638"/>
    <rect class="prog" x="796" y="250" width="308" height="5" rx="2.5" fill="#fbbf24"/>
    <rect class="scan" x="778" y="88" width="344" height="3" fill="#ffffff" opacity=".05"/>
  </g>
  <path d="M928 302h44l10 26h-64z" fill="#0a0f1a" stroke="#2a3650" stroke-width="2"/>
  <rect x="900" y="326" width="100" height="8" rx="4" fill="#2a3650"/>
</g></g>
</svg>
