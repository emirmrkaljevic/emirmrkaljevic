<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" width="480" height="170" role="img" aria-label="PanelOS: Windows app for small PC case screens">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.a1{animation:a1 3s ease-in-out infinite alternate} @keyframes a1{0%{transform:translateY(0)}100%{transform:translateY(74px)}}
.up{animation:up 6s linear infinite} @keyframes up{0%{transform:translateY(0)}100%{transform:translateY(-96px)}}
.eq rect{transform-box:fill-box;transform-origin:bottom;animation:eq .8s ease-in-out infinite alternate} @keyframes eq{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
.cell{animation:cell 4.8s ease-in-out infinite;opacity:.15} @keyframes cell{0%,100%{opacity:.15}20%,45%{opacity:1}}
</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#070b14"/></linearGradient>
  <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".22"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="480" height="170" rx="18"/></clipPath>
</defs>
<g clip-path="url(#cl)">
  <rect width="480" height="170" fill="url(#g)"/><rect width="480" height="170" fill="url(#gl)"/>
  <rect width="480" height="4" fill="#fbbf24"/>
</g>
<rect x="1" y="1" width="478" height="168" rx="17" fill="none" stroke="#1c2638" stroke-width="2"/>
<text class="sans" x="28" y="78" font-size="34" font-weight="800" fill="#e6edf7" letter-spacing="-.5">PanelOS</text>
<text class="mono" x="30" y="114" font-size="16" fill="#fbbf24">PC case screen, done right</text>

<g transform="translate(320 34)">
  <rect width="134" height="86" rx="10" fill="#0a0f1a" stroke="#2a3650" stroke-width="2"/>
  <rect x="8" y="8" width="118" height="70" rx="6" fill="#04060b"/>
  <circle cx="34" cy="38" r="17" fill="none" stroke="#1c2638" stroke-width="5"/>
  <circle cx="34" cy="38" r="17" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="106.8" stroke-linecap="round" transform="rotate(-90 34 38)">
    <animate attributeName="stroke-dashoffset" values="60;40;70;60" dur="5s" repeatCount="indefinite"/></circle>
  <text class="mono" x="34" y="42" font-size="11" fill="#e6edf7" text-anchor="middle">47°</text>
  <g class="eq"><rect x="62" y="22" width="6" height="40" rx="2" fill="#fbbf24" style="animation-duration:0.60s;animation-delay:-0.0s"/><rect x="71" y="22" width="6" height="40" rx="2" fill="#fbbf24" style="animation-duration:0.89s;animation-delay:-0.2s"/><rect x="80" y="22" width="6" height="40" rx="2" fill="#fbbf24" style="animation-duration:0.68s;animation-delay:-0.4s"/><rect x="89" y="22" width="6" height="40" rx="2" fill="#fbbf24" style="animation-duration:0.97s;animation-delay:-0.6s"/><rect x="98" y="22" width="6" height="40" rx="2" fill="#fbbf24" style="animation-duration:0.76s;animation-delay:-0.8s"/></g>
  <rect x="16" y="66" width="102" height="3" rx="1.5" fill="#1c2638"/><rect x="16" y="66" width="60" height="3" rx="1.5" fill="#fbbf24"><animate attributeName="width" values="4;102" dur="10s" repeatCount="indefinite"/></rect>
  <path d="M55 88h24l6 16h-36z" fill="#0a0f1a" stroke="#2a3650" stroke-width="2"/>
</g>
</svg>
