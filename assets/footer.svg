<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="Thanks for stopping by.">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="f" gradientUnits="userSpaceOnUse" x1="0" x2="600" spreadMethod="reflect">
<stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/>
<animate attributeName="x1" values="0;600;0" dur="8s" repeatCount="indefinite"/><animate attributeName="x2" values="600;1200;600" dur="8s" repeatCount="indefinite"/></linearGradient></defs>
<rect x="100" y="20" width="1000" height="3" rx="1.5" fill="url(#f)"/>
<text class="mono" x="600" y="66" font-size="18" fill="#8b98ad" text-anchor="middle">build <tspan fill="#22d3ee">→</tspan> ship <tspan fill="#a78bfa">→</tspan> learn <tspan fill="#fbbf24">→</tspan> repeat</text>
</svg>
